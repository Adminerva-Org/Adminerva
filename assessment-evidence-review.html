<!doctype html>
<!-- Instructor checkpoint approval, reopening and contribution verification. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assessment Evidence Review | Adminerva</title>
<script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/adminerva-ui.css?v=1.3.0">
<style>.evidence-embedded main{padding:0;margin:0;max-width:none}.evidence-embedded #evidenceDetails,.evidence-embedded #evidenceDiscovery{margin-top:0;padding:14px;border:0;box-shadow:none}</style>
</head><body class="bg-slate-50 min-h-screen">
<div id="adminerva-nav" data-module="repo" data-page="evidence"></div>
<main id="pageBody" class="hidden max-w-6xl mx-auto px-4 sm:px-6 py-8">
<header class="mb-6"><h1 class="text-2xl font-extrabold text-slate-900">Assessment Evidence Review</h1>
<p class="text-sm text-slate-600 mt-2">Verify selected GitHub commits and the project checkpoint before approving. Author names and Git dates alone do not prove student contribution or timely submission.</p></header>
<section class="bg-white p-5 rounded-xl border space-y-4">
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4"><label class="text-sm font-semibold">Section<select id="evidenceSection" class="mt-2 w-full p-3 border rounded-lg"><option value="">All sections</option></select></label><label class="text-sm font-semibold">Search students<input id="evidenceStudentSearch" type="search" placeholder="Name or GitHub username" class="mt-2 w-full p-3 border rounded-lg" aria-describedby="evidenceSearchStatus"></label><p id="evidenceSearchStatus" role="status" class="text-sm text-slate-600 sm:col-span-2"></p>
<label class="text-sm font-semibold">Student<select id="evidenceStudent" class="mt-2 w-full p-3 border rounded-lg bg-white"><option value="">Select student</option></select></label>
<label class="text-sm font-semibold">Assessment<select id="evidenceAssessment" class="mt-2 w-full p-3 border rounded-lg bg-white"><option value="">Select assessment</option></select></label></div>
<button id="evidenceLoad" type="button" class="rounded bg-indigo-700 text-white font-bold px-5 py-3">Load evidence</button>
<p id="evidenceReviewStatus" class="text-sm text-slate-700" role="status">Choose a student and assessment.</p></section>
<div id="evidenceWorkspace"></div>
</main>
<script src="js/core/adminerva-nav.js?v=1.3.3"></script>
<script src="js/core/adminerva-loader.js?v=1.3.0"></script>
<script type="module" src="js/core/auth-guard.js?v=1.3.0"></script>
<script type="module" src="js/repo-review/assessment-evidence-review.mjs?v=1.3.4"></script>
</body></html>
