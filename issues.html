<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Issue Tracker | Adminerva</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
    <link rel="stylesheet" href="css/adminerva-ui.css?v=2" />
</head>
  <body
    class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col hidden"
    id="pageBody"
  >
    <div id="adminerva-nav" data-module="global" data-page="issues"></div>

    <main class="flex-grow max-w-6xl mx-auto w-full px-4 sm:px-6 py-6 sm:py-8">
      <!-- Header & Filters -->
      <header
        class="mb-6 flex flex-col md:flex-row justify-between items-start md:items-end gap-4 border-b border-slate-200 pb-6"
      >
        <div>
          <h1
            class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight flex items-center gap-2"
          >
            <span class="text-cyan-600">🛠️</span> System Issue Tracker
          </h1>
          <p class="text-sm text-slate-500 mt-1 font-medium">
            Report bugs, request features, and track system updates.
          </p>
        </div>

        <div class="flex flex-wrap gap-2 w-full md:w-auto">
          <select
            id="filterCategory"
            class="border border-slate-300 rounded-lg px-3 py-2 text-sm font-bold bg-white text-slate-700 cursor-pointer focus:ring-2 focus:ring-cyan-500 outline-none flex-grow md:flex-grow-0"
          >
            <option value="All">All Categories</option>
            <option value="Bug">🐛 Bugs</option>
            <option value="Feature">✨ Features</option>
            <option value="Access">🔐 Access</option>
          </select>
          <select
            id="filterStatus"
            class="border border-slate-300 rounded-lg px-3 py-2 text-sm font-bold bg-white text-slate-700 cursor-pointer focus:ring-2 focus:ring-cyan-500 outline-none flex-grow md:flex-grow-0"
          >
            <option value="All">All Statuses</option>
            <option value="Open" selected>🟢 Open</option>
            <option value="In Progress">🟡 In Progress</option>
            <option value="Resolved">✅ Resolved</option>
          </select>
          <button
            onclick="
              document.getElementById('bug-modal').classList.remove('hidden')
            "
            class="bg-cyan-600 hover:bg-cyan-700 text-white font-bold px-4 py-2 rounded-lg transition shadow-sm flex-grow md:flex-grow-0 text-sm"
          >
            + New Report
          </button>
        </div>
      </header>

      <!-- The Feed -->
      <div id="issuesFeed" class="space-y-3">
        <!-- Skeleton Loader -->
        <div
          class="animate-pulse bg-white p-5 rounded-xl border border-slate-200"
        >
          <div class="h-4 bg-slate-200 rounded w-1/4 mb-4"></div>
          <div class="h-4 bg-slate-200 rounded w-3/4 mb-2"></div>
          <div class="h-4 bg-slate-200 rounded w-1/2"></div>
        </div>
      </div>
    </main>

    <!-- ✨ ISSUE DETAILS MODAL (Handles comments, screenshots, and admin controls) -->
    <div
      id="issueDetailsModal"
      class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[100] flex items-center justify-center p-4 sm:p-6"
    >
      <div
        class="bg-white rounded-xl shadow-2xl max-w-4xl w-full max-h-[95vh] flex flex-col overflow-hidden relative"
      >
        <!-- Modal Header -->
        <div
          class="p-5 border-b bg-slate-800 flex justify-between items-start text-white"
        >
          <div class="w-full">
            <div
              class="flex items-center gap-2 mb-2 flex-wrap"
              id="modalBadges"
            ></div>
            <h2 id="modalIssueTitle" class="text-xl font-bold"></h2>
            <div
              class="text-xs text-slate-400 mt-1 flex justify-between items-center w-full"
            >
              <span id="modalReporterData"></span>
              <span id="modalDateData"></span>
            </div>
          </div>
          <button
            onclick="closeIssueModal()"
            class="text-slate-400 hover:text-white text-2xl font-bold ml-4"
          >
            &times;
          </button>
        </div>

        <!-- 🚀 ADMIN CONTROLS INJECTION ZONE (Only visible to superadmins) -->
        <div
          id="adminControlPanel"
          class="hidden bg-amber-50 border-b border-amber-200 p-3 flex flex-wrap gap-3 items-center justify-between"
        >
          <div class="flex items-center gap-3">
            <span
              class="text-xs font-bold text-amber-800 uppercase tracking-widest"
              >Admin Controls:</span
            >
            <select
              id="adminStatusSelect"
              class="text-xs border border-amber-300 rounded px-2 py-1 font-bold bg-white text-slate-700 outline-none cursor-pointer"
            >
              <option value="Open">Status: Open</option>
              <option value="In Progress">Status: In Progress</option>
              <option value="Resolved">Status: Resolved</option>
              <option value="Closed (Won't Fix)">Status: Closed</option>
            </select>
            <select
              id="adminPrioritySelect"
              class="text-xs border border-amber-300 rounded px-2 py-1 font-bold bg-white text-slate-700 outline-none cursor-pointer"
            >
              <option value="Low">Priority: Low</option>
              <option value="Medium">Priority: Medium</option>
              <option value="High">Priority: High</option>
              <option value="Critical">Priority: Critical</option>
            </select>
          </div>
          <div class="flex gap-2">
            <button
              id="adminLockBtn"
              class="text-xs bg-slate-700 text-white font-bold px-3 py-1.5 rounded hover:bg-slate-800 transition"
            >
              🔒 Lock Comments
            </button>
            <button
              id="adminDeleteBtn"
              class="text-xs bg-red-100 text-red-600 font-bold px-3 py-1.5 rounded hover:bg-red-200 transition"
            >
              🗑️ Delete Thread
            </button>
          </div>
        </div>

        <div
          class="flex-1 overflow-y-auto bg-slate-50 flex flex-col md:flex-row"
        >
          <!-- Left: Original Report -->
          <div
            class="w-full md:w-1/2 p-5 border-b md:border-b-0 md:border-r border-slate-200 bg-white"
          >
            <h3
              class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2"
            >
              Issue Description
            </h3>
            <p
              id="modalIssueDescription"
              class="text-sm text-slate-700 whitespace-pre-wrap leading-relaxed mb-6"
            ></p>

            <h3
              class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2"
            >
              Attached Evidence
            </h3>
            <div id="modalScreenshots" class="grid grid-cols-2 gap-2">
              <!-- Screenshots injected here -->
            </div>
          </div>

          <!-- Right: Comments & Voting -->
          <div class="w-full md:w-1/2 p-5 flex flex-col bg-slate-50">
            <!-- Voting Widget -->
            <div
              class="bg-white border border-slate-200 rounded-lg p-3 flex justify-between items-center mb-4 shadow-sm"
            >
              <span class="text-sm font-bold text-slate-600"
                >Does this affect you too?</span
              >
              <button
                id="upvoteBtn"
                class="flex items-center gap-2 px-3 py-1.5 rounded-full border border-slate-300 hover:bg-indigo-50 hover:text-indigo-600 hover:border-indigo-300 font-bold text-sm text-slate-500 transition"
              >
                👍 <span id="upvoteCount">0</span>
              </button>
            </div>

            <h3
              class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3"
            >
              Discussion (<span id="commentCount">0</span>)
            </h3>

            <!-- Comments Feed -->
            <div
              id="commentsFeed"
              class="flex-1 overflow-y-auto space-y-3 mb-4 pr-2 hide-scrollbar"
            >
              <!-- Comments injected here -->
            </div>

            <!-- Comment Input Box -->
            <div
              id="commentInputBox"
              class="mt-auto pt-3 border-t border-slate-200 relative"
            >
              <textarea
                id="newCommentText"
                rows="2"
                class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500 bg-white resize-none"
                placeholder="Add a comment or solution..."
              ></textarea>
              <button
                id="postCommentBtn"
                class="absolute bottom-3 right-2 bg-cyan-600 text-white p-1.5 rounded-md hover:bg-cyan-700 transition"
              >
                <svg
                  class="w-4 h-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"
                  ></path>
                </svg>
              </button>
            </div>

            <div
              id="lockedNotice"
              class="hidden mt-auto p-3 bg-amber-50 border border-amber-200 text-amber-800 rounded-lg text-center text-sm font-bold"
            >
              🔒 This thread has been locked by an Admin.
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Image Fullscreen Overlay -->
    <div
      id="imageViewerModal"
      class="hidden fixed inset-0 bg-black/95 z-[200] flex items-center justify-center p-4"
      onclick="this.classList.add('hidden')"
    >
      <img
        id="fullscreenImage"
        src=""
        class="max-w-full max-h-full object-contain rounded shadow-2xl"
      />
      <p class="absolute bottom-4 text-white text-sm opacity-50">
        Click anywhere to close
      </p>
    </div>

    <!-- Core Scripts -->
    <script src="js/core/adminerva-nav.js"></script>
    <script src="js/core/adminerva-loader.js"></script>
    <script type="module" src="js/core/auth-guard.js"></script>
    <script type="module" src="js/core/issues.js"></script>
  </body>
</html>
