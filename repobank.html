<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>RepoReview - Repobank Directory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/adminerva-ui.css?v=2" />
</head>
  <body class="bg-gray-100 font-sans min-h-screen flex flex-col">
    <!-- Navigation -->
    <div id="adminerva-nav" data-module="repo" data-page="repobank"></div>

    <div
      class="max-w-screen-2xl mx-auto w-full p-4 sm:p-6 mt-2 sm:mt-4 flex-1 flex flex-col gap-6"
    >
      <!-- Header & Section Filter -->
      <div
        class="bg-white p-5 sm:p-6 rounded-lg shadow-sm border border-gray-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4"
      >
        <div>
          <h2
            class="text-xl sm:text-2xl font-bold text-gray-800 flex items-center gap-2"
          >
            🧠 Repobank Directory
          </h2>
          <p class="text-xs sm:text-sm text-gray-500 mt-1">
            System-generated long-term memory, project concepts, and role
            tracking.
          </p>
        </div>
        <div
          class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-3 w-full sm:w-auto"
        >
          <label
            class="text-[10px] sm:text-sm font-bold text-gray-700 uppercase tracking-wider"
            >Class Section:</label
          >
          <select
            id="sectionSelect"
            onchange="loadRepobankData()"
            class="w-full sm:w-auto p-3 sm:p-2 border border-gray-300 rounded font-semibold focus:ring-blue-500 bg-gray-50 min-w-[200px] text-base sm:text-sm"
          ></select>
        </div>
      </div>

      <!-- Main Content Grid -->
      <div
        id="repobankContainer"
        class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5 sm:gap-6 pb-12"
      >
        <div class="text-gray-500 italic font-medium col-span-full">
          Select a section to load Repobank data...
        </div>
      </div>
    </div>
    <!-- Core Scripts -->
    <script src="js/core/adminerva-loader.js?v=2026.10.16.3"></script>
    <script src="js/core/adminerva-nav.js?v=2026.10.16.3"></script>
    <script type="module" src="js/core/auth-guard.js?v=2026.10.16.3"></script>
    <script type="module" src="js/repo-review/repobank.js"></script>
  </body>
</html>
