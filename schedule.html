<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>LessonReview - Teacher's Schedule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <link rel="stylesheet" href="css/adminerva-ui.css?v=2" />
</head>
  <body class="bg-gray-50 font-sans min-h-screen flex flex-col">
    <div id="adminerva-nav" data-module="lesson" data-page="schedule"></div>
    <script src="js/core/adminerva-nav.js"></script>

    <!-- Main Workspace -->
    <div
      class="max-w-screen-2xl mx-auto w-full p-4 sm:p-6 mt-2 sm:mt-4 flex-1 flex flex-col"
    >
      <div
        class="bg-white p-4 sm:p-6 rounded-lg shadow-sm border border-gray-200 flex-1 flex flex-col"
      >
        <!-- Header Section (Stacked on Mobile) -->
        <div
          class="flex flex-col lg:flex-row lg:justify-between lg:items-end mb-4 pb-4 border-b border-gray-200 gap-4 lg:gap-0"
        >
          <div class="flex flex-col sm:flex-row sm:items-center gap-3">
            <div>
              <h2 class="text-xl sm:text-2xl font-bold text-gray-800">
                Master Teaching Schedule
              </h2>
              <p class="text-xs sm:text-sm text-gray-500 mt-1">
                Schedule is locked by default. Click Edit to modify timeslots.
              </p>
            </div>
            <span
              id="modeBadge"
              class="bg-gray-200 text-gray-700 text-[10px] sm:text-xs font-extrabold px-3 py-1.5 rounded-full uppercase tracking-wider w-fit"
              >🔒 Read-Only</span
            >
          </div>
          <div
            class="flex flex-wrap sm:flex-nowrap gap-2 sm:gap-3 w-full lg:w-auto"
          >
            <button
              onclick="openSettingsModal()"
              class="w-full sm:w-auto justify-center bg-gray-800 text-white px-4 py-3 sm:py-2 rounded font-bold hover:bg-gray-700 transition shadow-sm flex items-center gap-2 text-sm"
            >
              <span>⚙️</span> Settings
            </button>
            <!-- These buttons only appear in Edit Mode -->
            <button
              id="addClassBtn"
              onclick="addRow('class')"
              class="hidden w-full sm:w-auto justify-center bg-blue-100 text-blue-800 border border-blue-300 px-4 py-3 sm:py-2 rounded font-bold hover:bg-blue-200 transition shadow-sm items-center gap-2 text-sm"
            >
              <span>➕</span> Class Row
            </button>
            <button
              id="addEventBtn"
              onclick="addRow('constant')"
              class="hidden w-full sm:w-auto justify-center bg-amber-100 text-amber-800 border border-amber-300 px-4 py-3 sm:py-2 rounded font-bold hover:bg-amber-200 transition shadow-sm items-center gap-2 text-sm"
            >
              <span>➕</span> Weekly Event
            </button>
            <!-- Main Toggle -->
            <button
              id="editSaveBtn"
              onclick="toggleEditMode()"
              class="w-full sm:w-auto justify-center bg-blue-600 text-white px-6 py-3 sm:py-2 rounded font-bold hover:bg-blue-700 transition shadow-sm flex items-center gap-2 text-sm"
            >
              <span>✏️</span> Edit Schedule
            </button>
          </div>
        </div>

        <!-- Each semester has its own editable schedule and cloud record. -->
        <div class="flex flex-col sm:flex-row sm:items-end gap-3 mb-4 p-4 bg-blue-50 border border-blue-100 rounded-lg">
          <label class="flex flex-col gap-1 text-xs font-semibold text-blue-900">
            School Year
            <input id="scheduleSchoolYear" type="text" value="2026-2027"
              class="bg-white border border-blue-200 rounded px-3 py-2 text-sm min-h-11"
              placeholder="2026-2027" aria-label="Schedule school year" />
          </label>
          <label class="flex flex-col gap-1 text-xs font-semibold text-blue-900">
            Semester
            <select id="scheduleSemester" class="bg-white border border-blue-200 rounded px-3 py-2 text-sm min-h-11"
              aria-label="Schedule semester">
              <option value="S1">First Semester</option>
              <option value="S2">Second Semester</option>
            </select>
          </label>
          <p id="scheduleScopeStatus" role="status" aria-live="polite"
            class="text-xs sm:pb-2 text-blue-900">Select a school year and semester to load its schedule.</p>
        </div>

        <!-- Flexible Schedule Table (Swipeable on Mobile) -->
        <div
          class="flex-1 overflow-x-auto border border-gray-200 rounded w-full touch-pan-x"
        >
          <table class="min-w-[800px] w-full bg-white">
            <thead class="bg-gray-100 border-b-2 border-gray-200">
              <tr>
                <th
                  class="py-3 px-4 text-left text-[10px] sm:text-xs font-bold text-gray-600 uppercase w-[15%]"
                >
                  Time Slot
                </th>
                <th
                  class="py-3 px-2 text-center text-[10px] sm:text-xs font-bold text-gray-600 uppercase w-[16%]"
                >
                  Monday
                </th>
                <th
                  class="py-3 px-2 text-center text-[10px] sm:text-xs font-bold text-gray-600 uppercase w-[16%]"
                >
                  Tuesday
                </th>
                <th
                  class="py-3 px-2 text-center text-[10px] sm:text-xs font-bold text-gray-600 uppercase w-[16%]"
                >
                  Wednesday
                </th>
                <th
                  class="py-3 px-2 text-center text-[10px] sm:text-xs font-bold text-gray-600 uppercase w-[16%]"
                >
                  Thursday
                </th>
                <th
                  class="py-3 px-2 text-center text-[10px] sm:text-xs font-bold text-gray-600 uppercase w-[16%]"
                >
                  Friday
                </th>
                <th
                  class="py-3 px-2 text-center text-[10px] sm:text-xs font-bold text-gray-400 uppercase w-[5%]"
                ></th>
              </tr>
            </thead>
            <tbody id="scheduleTableBody">
              <!-- Dynamic Rows -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- SCHEDULE SETTINGS MODAL -->
    <div
      id="settingsModal"
      class="hidden fixed inset-0 bg-gray-900 bg-opacity-75 z-[100] items-end sm:items-center justify-center p-4"
    >
      <div
        class="bg-white w-full max-w-lg rounded-xl shadow-2xl flex flex-col overflow-hidden transform transition-all"
      >
        <div
          class="px-5 sm:px-6 py-4 border-b bg-gray-50 flex justify-between items-center"
        >
          <h3 class="text-base sm:text-lg font-bold text-gray-800">
            ⚙️ Schedule Settings
          </h3>
          <button
            onclick="closeSettingsModal()"
            class="text-gray-400 hover:text-red-500 font-bold transition text-xl p-2"
          >
            ✖
          </button>
        </div>
        <div class="p-5 sm:p-6 space-y-5">
          <div>
            <label
              class="block text-[10px] sm:text-xs font-bold text-gray-600 uppercase mb-1"
              >My Sections (Comma Separated)</label
            >
            <input
              type="text"
              id="configSections"
              placeholder="e.g. Grade 11-A, Grade 12-B"
              class="w-full p-3 sm:p-2 border rounded text-base sm:text-sm focus:ring-blue-500 bg-gray-50"
            />
          </div>
          <div>
            <label
              class="block text-[10px] sm:text-xs font-bold text-gray-600 uppercase mb-1"
              >My Subjects (Comma Separated)</label
            >
            <input
              type="text"
              id="configSubjects"
              placeholder="e.g. Comprog, Work Immersion"
              class="w-full p-3 sm:p-2 border rounded text-base sm:text-sm focus:ring-blue-500 bg-gray-50"
            />
          </div>
          <div>
            <label
              class="block text-[10px] sm:text-xs font-bold text-gray-600 uppercase mb-1"
              >My Events (Comma Separated)</label
            >
            <input
              type="text"
              id="configEvents"
              placeholder="e.g. Lunch Break, Holy Mass"
              class="w-full p-3 sm:p-2 border rounded text-base sm:text-sm focus:ring-amber-500 bg-amber-50 border-amber-200"
            />
            <p class="text-[10px] text-gray-500 mt-1">
              Events are used for non-teaching periods.
            </p>
          </div>
        </div>
        <div
          class="px-5 sm:px-6 py-4 border-t bg-gray-50 flex flex-col sm:flex-row justify-end gap-3"
        >
          <button
            onclick="closeSettingsModal()"
            class="w-full sm:w-auto px-4 py-3 sm:py-2 text-gray-600 font-bold hover:bg-gray-200 rounded text-sm transition"
          >
            Cancel
          </button>
          <button
            onclick="saveSettingsConfig()"
            class="w-full sm:w-auto bg-blue-600 text-white px-6 py-3 sm:py-2 rounded font-bold hover:bg-blue-700 shadow-sm text-sm"
          >
            Save Options
          </button>
        </div>
      </div>
    </div>

    <!-- GLOBAL LOADING OVERLAY -->
    <div
      id="globalLoader"
      class="hidden fixed inset-0 bg-gray-900 bg-opacity-80 z-[110] items-center justify-center flex-col"
    >
      <div
        class="animate-spin rounded-full h-12 sm:h-16 w-12 sm:w-16 border-t-4 border-blue-500 border-solid mb-4"
      ></div>
      <p
        id="loaderMessage"
        class="text-white font-bold text-sm sm:text-lg tracking-wider"
      >
        Syncing to Cloud...
      </p>
    </div>

    <script type="module" src="js/lesson-review/schedule.js"></script>
    <script src="js/core/adminerva-loader.js"></script>
  </body>
</html>
