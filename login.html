<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Adminerva | Secure Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/adminerva-ui.css?v=1" />
</head>
  <body
    class="bg-slate-900 min-h-screen flex flex-col items-center justify-center font-sans text-slate-300 p-4"
  >
    <div
      class="bg-slate-800 p-6 sm:p-8 rounded-xl shadow-2xl border border-slate-700 max-w-md w-full mx-auto"
    >
      <div class="text-center mb-6 sm:mb-8">
        <img
          src="assets/New Adminerva logo.png"
          alt="Adminerva Logo"
          class="h-14 sm:h-16 mx-auto mb-3 sm:mb-4 object-contain mix-blend-lighten drop-shadow-[0_0_15px_rgba(6,182,212,0.3)] hover:scale-105 transition-transform duration-300"
        />
        <span
          class="text-2xl sm:text-3xl font-black text-white tracking-wider flex items-center justify-center gap-2 mb-1 sm:mb-2"
        >
          ADMINERVA
        </span>
        <p class="text-xs sm:text-sm text-slate-400 font-medium">
          Secure Gateway
        </p>
      </div>

      <div id="loginForm" class="space-y-3 sm:space-y-4">
        <button
          id="googleLoginBtn"
          class="w-full bg-white hover:bg-gray-100 text-gray-800 font-bold py-3.5 sm:py-3 px-4 rounded-lg transition shadow flex items-center justify-center gap-3 text-sm sm:text-base"
        >
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path
              fill="#4285F4"
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
            />
            <path
              fill="#34A853"
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
            />
            <path
              fill="#FBBC05"
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
            />
            <path
              fill="#EA4335"
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
            />
          </svg>
          Continue with Google
        </button>

        <button
          id="githubLoginBtn"
          class="w-full bg-[#24292F] hover:bg-[#1a1e22] text-white font-bold py-3.5 sm:py-3 px-4 rounded-lg transition shadow flex items-center justify-center gap-3 text-sm sm:text-base"
        >
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
            <path
              fill-rule="evenodd"
              d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"
              clip-rule="evenodd"
            />
          </svg>
          Continue with GitHub
        </button>

        <!-- The Error Box -->
        <div
          id="loginErrorBox"
          class="hidden mt-6 bg-red-900/30 border border-red-500/50 rounded-lg p-4 sm:p-5 text-center shadow-lg"
        >
          <div class="text-red-500 text-3xl mb-2">⛔</div>
          <h3
            class="text-red-400 font-black text-base sm:text-lg uppercase tracking-wider mb-1"
          >
            Access Denied
          </h3>
          <p class="text-slate-300 text-xs sm:text-sm font-medium mb-4">
            Your email address is not recognized by the system.
          </p>
          <div
            class="bg-slate-900/80 p-3 sm:p-4 rounded text-[10px] sm:text-xs text-slate-400 border border-slate-700/50 text-left"
          >
            <span class="block text-slate-200 font-bold mb-1"
              >Required Action:</span
            >
            Contact your Instructor or the System Administrator to have your
            official email added to the Adminerva class list before attempting
            to log in again.
          </div>
        </div>
      </div>
    </div>
    <script src="js/core/adminerva-loader.js"></script>
    <script type="module" src="js/core/login.js"></script>
  </body>
</html>
