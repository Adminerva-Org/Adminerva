name: V2 review browser validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install isolated browser test dependencies
        run: npm install --no-audit --no-fund --no-save @firebase/rules-unit-testing@4 firebase@11 firebase-tools@14 firebase-admin@13 playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise real emulator authentication and review lifecycle
        env:
          ADMINERVA_TEST_OUTPUT: ${{ runner.temp }}/adminerva-browser-validation
        run: npx firebase emulators:exec --config firebase.browser.json --project demo-adminerva-browser --only auth,firestore 'node --test tests/browser/review-lifecycle.smoke.mjs'
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-review-browser-results
          path: ${{ runner.temp }}/adminerva-browser-validation
          if-no-files-found: ignore
          retention-days: 7
