name: MCS V4 legacy admin access bridge

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mcs-v4-legacy-admin-access.yml"

permissions:
  contents: read

concurrency:
  group: mcs-v4-legacy-admin-access
  cancel-in-progress: false

jobs:
  grant:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions
      - name: Prepare Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_REPOREVIEW_E7CA4 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FIREBASE_SERVICE_ACCOUNT:-}"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - name: Grant existing Adminerva admin MCS V4 school-admin access
        shell: bash
        run: |
          cd functions
          NODE_PATH="$PWD/node_modules" node ../scripts/mcs-v4-legacy-admin-access.cjs
      - if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
