name: Release source packaging
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  release-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse release sources and resolve local assets
        run: node scripts/check-release-source.mjs
      - name: Check first-release reliability invariants
        run: node scripts/check-first-release-reliability.mjs
      - name: Run focused first-release tests
        run: node --test tests/teaching-firestore.test.mjs js/repo-review/services/commit-history.test.mjs js/core/adminerva-nav.test.mjs js/core/report-dialog.test.mjs js/lesson-review/schedule-scope.test.mjs tests/staff-workspaces.test.mjs
