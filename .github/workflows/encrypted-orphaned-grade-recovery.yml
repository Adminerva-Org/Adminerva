name: Encrypted St Isidore Practical Examination audit

on:
  push:
    branches:
      - ops/recover-deleted-assessment-grades-20261109
    paths:
      - ".github/workflows/encrypted-orphaned-grade-recovery.yml"
      - "scripts/recover-orphaned-grades.cjs"

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions
      - name: Prepare Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_REPOREVIEW_E7CA4 }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - name: Build encrypted St Isidore Practical Examination audit
        env:
          RECOVERY_OUTPUT: ${{ runner.temp }}/st-isidore-practical.enc.json
        shell: bash
        run: |
          set -euo pipefail
          NODE_PATH="$GITHUB_WORKSPACE/functions/node_modules" node scripts/recover-orphaned-grades.cjs
      - name: Upload encrypted audit
        uses: actions/upload-artifact@v4
        with:
          name: st-isidore-practical-encrypted
          path: ${{ runner.temp }}/st-isidore-practical.enc.json
          if-no-files-found: error
          retention-days: 1
      - if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json" "$RUNNER_TEMP/st-isidore-practical.enc.json"
