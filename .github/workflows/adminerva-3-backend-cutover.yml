name: Adminerva 3 backend cutover
on:
  push:
    branches:
      - release/3.0.0-backend-cutover-20261030
permissions:
  contents: read
concurrency:
  group: firebase-production
  cancel-in-progress: false
jobs:
  backend-cutover:
    if: github.repository == 'Adminerva-Org/Adminerva' && github.ref == 'refs/heads/release/3.0.0-backend-cutover-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify reviewed source and unpublished public version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '1485adfd0761410230e84b129ba6db2f9d5f6144'
          node -e 'const fs=require("fs"); const v=JSON.parse(fs.readFileSync("site-release.json","utf8")); if(v.version!=="2.1.2")process.exit(1);'
          node scripts/check-release-source.mjs
      - name: Configure Firebase deployment credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_REPOREVIEW_E7CA4 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            echo "::error::Production Firebase deployment secret is not configured."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/adminerva-firebase.json"
          chmod 600 "$RUNNER_TEMP/adminerva-firebase.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/adminerva-firebase.json" >> "$GITHUB_ENV"
      - name: Deploy 3.0 Firestore rules and indexes before the website
        run: npx -y firebase-tools@14 deploy --project reporeview-e7ca4 --only firestore:rules,firestore:indexes --non-interactive
