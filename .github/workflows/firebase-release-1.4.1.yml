name: Firebase 1.4.1 release deployment
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/firebase-release-1.4.1.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      FIREBASE_CI_TOKEN: ${{ secrets.FIREBASE_CI_TOKEN }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_REPOREVIEW_E7CA4 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare Firebase credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
            echo "AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "AUTH_MODE=token" >> "$GITHUB_ENV"
          elif [ -n "${FIREBASE_CI_TOKEN:-}" ]; then
            echo "FIREBASE_TOKEN=$FIREBASE_CI_TOKEN" >> "$GITHUB_ENV"
            echo "AUTH_MODE=token" >> "$GITHUB_ENV"
          else
            echo "::error::No Firebase deployment credential is configured in repository Actions secrets."
            exit 1
          fi
      - name: Deploy Firestore indexes and Cloud Functions
        shell: bash
        run: |
          set -euo pipefail
          if [ "$AUTH_MODE" = "token" ]; then
            npx -y firebase-tools@14 deploy --project reporeview-e7ca4 --only firestore:indexes,functions --non-interactive --token "$FIREBASE_TOKEN"
          else
            npx -y firebase-tools@14 deploy --project reporeview-e7ca4 --only firestore:indexes,functions --non-interactive
          fi
