name: Adminerva quality checks
on:
  push:
    branches: [main, feature/grading-overhaul]
  pull_request:
    branches: [main, feature/review-workflow-and-student-labs]
jobs:
  javascript-regressions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test grading evidence and feedback regressions
        run: |
          node --test tests/google-docs-export.test.mjs
          node --test tests/staff-workspaces.test.mjs
          node --test tests/review-resilience.test.mjs js/repo-review/services/github-evidence-client.test.mjs
          node --test tests/evidence-readiness.test.mjs
          node --test tests/student-search.test.mjs tests/help-access.test.mjs
          node --test js/analytics/academic-model.test.mjs
          node --test js/analytics/activity-model.test.mjs tests/loading-and-routes.test.mjs tests/monitoring-model.test.mjs
          node --test js/core/patch-history.test.mjs js/student/practice-points.test.mjs js/student/xml-layout.test.mjs js/presentation-review/lesson-to-slides.test.mjs js/presentation-review/lesson-slide-integration.test.mjs js/repo-review/services/review-snapshot.test.mjs
          node --test js/repo-review/services/evidence-lifecycle.test.mjs js/repo-review/services/review-requests.test.mjs tests/review-workspace.test.mjs
          node --test js/repo-review/services/v2-grading-assistant.test.mjs js/repo-review/services/grade-revision-snapshot.test.mjs js/core/feedback-format.test.mjs js/repo-review/services/commit-substance.test.mjs js/repo-review/services/contribution-resolver.test.mjs js/repo-review/services/assessment-evidence.test.mjs js/repo-review/services/commit-history.test.mjs js/repo-review/services/inspector-helpers.test.mjs js/core/notification-routing.test.mjs js/core/report-filters.test.mjs js/core/notification-visibility.test.mjs js/core/adminerva-nav.test.mjs js/lesson-review/lesson-plan-helpers.test.mjs js/lesson-review/reference-context.test.mjs js/lesson-review/lesson-editor.test.mjs js/lesson-review/schedule-scope.test.mjs js/lesson-review/lesson-workflow.test.mjs js/repo-review/assessment-dates.test.mjs js/student/assessment-state.test.mjs js/student/playground-storage.test.mjs js/student/practice-courses.test.mjs js/student/practice-playground-bridge.test.mjs tests/lesson-school-format.test.mjs
      - name: Check notification, issue, and submission module syntax
        run: |
          for file in js/analytics/*.mjs js/help/*.mjs js/core/staff-role.mjs; do node --check "$file"; done
          node --check js/repo-review/services/evidence-lifecycle.mjs
          node --check js/core/staff-session.mjs
          node --check js/repo-review/services/grade-version.mjs
          node --check js/repo-review/services/request-backoff.mjs
          node --check js/repo-review/services/publication-queue.mjs
          node --check js/repo-review/grade-publication.mjs
          node --check js/repo-review/review-ui.mjs
          node --check js/repo-review/feedback-drawer.mjs
          node --check js/core/teacher-accounts.mjs
          node --check js/lesson-review/workspace-model.mjs
          node --check js/lesson-review/workspace-session.mjs
          node --check js/analytics/academic-model.mjs
          node --check js/repo-review/services/evidence-transaction.mjs
          node --check js/repo-review/gradebook-quarter.mjs
          node --input-type=module --check < js/repo-review/gradebook.js
          node --input-type=module --check < js/repo-review/group-inspector.js
          node --input-type=module --check < js/repo-review/services/grade-revision-snapshot.mjs
          node --input-type=module --check < js/repo-review/v2-grading-queue.mjs
          node --input-type=module --check < js/repo-review/services/v2-grading-assistant.mjs
          node --input-type=module --check < js/repo-review/assessment-evidence-review.mjs
          node --input-type=module --check < js/student/assessment-evidence.mjs
          node --input-type=module --check < js/repo-review/submissions.mjs
          node --input-type=module --check < js/repo-review/services/assessment-evidence.mjs
          node --input-type=module --check < js/repo-review/services/commit-history.mjs
          node --input-type=module --check < js/repo-review/contribution-inspector.js
          node --input-type=module --check < js/repo-review/assessment-studio.js
          node --input-type=module --check < js/repo-review/assessment-dates.mjs
          node --input-type=module --check < js/core/notifications.mjs
          node --input-type=module --check < js/core/report-filters.mjs
          node --input-type=module --check < js/core/issues.js
          node --input-type=module --check < js/core/notification-history.mjs
          node --input-type=module --check < js/core/site-updates.mjs
          node --input-type=module --check < js/student/practice-courses.mjs
          node --input-type=module --check < js/student/practice.js
          node --input-type=module --check < js/student/practice-playground-bridge.mjs
          node --input-type=module --check < js/student/submission-receipts.mjs
          node --input-type=module --check < js/lesson-review/library.js
          node --input-type=module --check < js/presentation-review/presentation-export.js
          node --input-type=module --check < js/core/issues.js
          node --input-type=module --check < js/core/adminerva-loader.js
          node --input-type=module --check < js/core/adminerva-nav.js
          node --input-type=module --check < js/repo-review/repofetch.js
          node --input-type=module --check < js/repo-review/manual-review.mjs
          node --check js/repo-review/review-panels.mjs
          node --check js/repo-review/evidence-review-view.mjs
          node --check js/repo-review/services/review-requests.mjs
          node --input-type=module --check < js/repo-review/auto-checker.js
          node --input-type=module --check < js/lesson-review/reference-context.mjs
          node --input-type=module --check < js/lesson-review/schedule.js
          node --input-type=module --check < js/lesson-review/schedule-scope.mjs
          node --input-type=module --check < js/settings/settings-lesson.js
          node --input-type=module --check < js/lesson-review/lesson-firebase.js
          node --input-type=module --check < js/lesson-review/ai-engine.js
          node --input-type=module --check < js/lesson-review/app-ui.js
          node --input-type=module --check < js/lesson-review/document-exporter.js
          node --input-type=module --check < js/lesson-review/lesson-plan-helpers.mjs
          node --input-type=module --check < js/presentation-review/presentation-firebase.js
          node --input-type=module --check < js/presentation-review/presentation-ui.js
          node --input-type=module --check < js/presentation-review/presentation-ai.js
          node --input-type=module --check < js/presentation-review/sanitize.js
          node --input-type=module --check < js/student/playground.js
          node --input-type=module --check < js/student/playground-storage.mjs
          node --input-type=module --check < js/student/playground-cloud.mjs
          node --input-type=module --check < js/student/assessments.js
          node --input-type=module --check < js/student/assessment-state.mjs
          node --input-type=module --check < js/student/submission-receipts.mjs
          node --check functions/index.js
          npm --prefix functions run check
      - name: Verify packaged backend handler exports without data operations
        env:
          GCLOUD_PROJECT: demo-adminerva-contract
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8181
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9199
        run: |
          npm ci --prefix functions --no-audit --no-fund
          node --test tests/monitoring-deployment.test.cjs
  firestore-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Firebase emulator and test SDK
        run: npm install --no-audit --no-fund --no-save @firebase/rules-unit-testing@4 firebase@11 firebase-tools@14 firebase-admin@13
      - name: Test Firestore permissions in an isolated emulator
        run: npx firebase emulators:exec --project demo-adminerva-security --only firestore 'node --test --test-concurrency=1 tests/firestore-rules.test.mjs tests/monitoring-maintenance.emulator.mjs tests/staff-workspaces.emulator.mjs'
