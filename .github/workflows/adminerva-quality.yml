name: Adminerva quality checks
on:
  push:
    branches: [main, feature/grading-overhaul]
  pull_request:
    branches: [main]
jobs:
  javascript-regressions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test grading evidence and feedback regressions
        run: |
          node --test js/core/feedback-format.test.mjs js/repo-review/services/commit-substance.test.mjs js/repo-review/services/contribution-resolver.test.mjs js/repo-review/services/inspector-helpers.test.mjs js/core/notification-routing.test.mjs js/core/adminerva-nav.test.mjs js/lesson-review/lesson-plan-helpers.test.mjs js/lesson-review/lesson-editor.test.mjs js/lesson-review/schedule-scope.test.mjs js/lesson-review/lesson-workflow.test.mjs js/student/assessment-state.test.mjs js/student/playground-storage.test.mjs js/student/practice-courses.test.mjs js/student/practice-playground-bridge.test.mjs tests/lesson-school-format.test.mjs
      - name: Check notification, issue, and submission module syntax
        run: |
          node --input-type=module --check < js/core/notifications.mjs
          node --input-type=module --check < js/core/notification-history.mjs
          node --input-type=module --check < js/core/site-updates.mjs
          node --input-type=module --check < js/student/practice-courses.mjs
          node --input-type=module --check < js/student/practice.js
          node --input-type=module --check < js/student/practice-playground-bridge.mjs
          node --input-type=module --check < js/student/submission-receipts.mjs
          node --input-type=module --check < js/lesson-review/library.js
          node --input-type=module --check < js/presentation-review/presentation-export.js
          node --input-type=module --check < js/core/issues.js
          node --input-type=module --check < js/core/adminerva-loader.js
          node --input-type=module --check < js/core/adminerva-nav.js
          node --input-type=module --check < js/repo-review/auto-checker.js
          node --input-type=module --check < js/lesson-review/schedule.js
          node --input-type=module --check < js/lesson-review/schedule-scope.mjs
          node --input-type=module --check < js/settings/settings-lesson.js
          node --input-type=module --check < js/lesson-review/lesson-firebase.js
          node --input-type=module --check < js/lesson-review/ai-engine.js
          node --input-type=module --check < js/lesson-review/app-ui.js
          node --input-type=module --check < js/lesson-review/document-exporter.js
          node --input-type=module --check < js/lesson-review/lesson-plan-helpers.mjs
          node --input-type=module --check < js/presentation-review/presentation-firebase.js
          node --input-type=module --check < js/presentation-review/presentation-ui.js
          node --input-type=module --check < js/presentation-review/presentation-ai.js
          node --input-type=module --check < js/presentation-review/sanitize.js
          node --input-type=module --check < js/student/playground.js
          node --input-type=module --check < js/student/playground-storage.mjs
          node --input-type=module --check < js/student/playground-cloud.mjs
          node --input-type=module --check < js/student/assessments.js
          node --input-type=module --check < js/student/assessment-state.mjs
          node --input-type=module --check < js/student/submission-receipts.mjs
          node --check functions/index.js
  firestore-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Firebase emulator and test SDK
        run: npm install --no-audit --no-fund --no-save @firebase/rules-unit-testing@4 firebase@11 firebase-tools@14
      - name: Test Firestore permissions in an isolated emulator
        run: npx firebase emulators:exec --project demo-adminerva-security --only firestore 'node --test tests/firestore-rules.test.mjs'
