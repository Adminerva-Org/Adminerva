name: Shared UI cache bump

on:
  push:
    branches: [main]
    paths:
      - "css/adminerva-ui.css"
      - "css/public-shell.css"
      - "css/documentation.css"
      - "js/core/adminerva-nav.js"
      - "js/core/public-shell.mjs"
      - "js/core/account-context-switcher.mjs"
      - "js/core/adminerva-loader.js"
      - "js/core/release-footer.js"
      - "js/core/owner-school-registry.mjs"
      - "js/core/navigation-ia.mjs"
      - "js/core/auth-guard-v4-pilot.js"
      - "js/school-admin/people-access.mjs"
      - "js/student/assessments.js"
      - "js/student/student-access.mjs"
      - "js/student/dashboard.js"
      - "js/student/assessment-evidence.mjs"
      - "js/student/submission-receipts.mjs"
      - "js/student/school-student-settings.mjs"
      - "js/student/school-student-projects.mjs"
      - "js/student/github-session.mjs"
      - "js/settings/settings-core.js"
      - "js/settings/account-preferences.mjs"
      - "js/settings/role-settings.mjs"
      - "js/help/activity-preferences.mjs"
      - "js/help/page-help.mjs"
      - "js/analytics/activity-client.mjs"
      - "student-settings.html"
      - "guest-settings.html"
      - "school-student-settings.html"
      - "school-student-projects.html"
      - "settings.html"
      - ".github/workflows/shared-ui-cache-bump.yml"

permissions:
  contents: write

concurrency:
  group: adminerva-shared-ui-main
  cancel-in-progress: true

jobs:
  refresh-shared-shell-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh and publish shared UI references
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Adminerva UI Sync"
          git config user.email "actions@users.noreply.github.com"
          # Regenerate from the latest main on each attempt, not the triggering
          # commit. The disposable runner checkout contains no user work.
          # A normal push must never overwrite a concurrent release.
          for attempt in 1 2 3; do
            git fetch origin main
            base="$(git rev-parse FETCH_HEAD)"
            git checkout --detach "$base"
            export VERSION="$(git rev-parse --short=12 HEAD)"
            python - <<'PY'
            from pathlib import Path
            import os, re

            version=os.environ["VERSION"]

            loader=Path("js/core/adminerva-loader.js")
            if loader.exists():
                text=loader.read_text(encoding="utf-8")
                updated=re.sub(
                    r'page-help\.mjs\?v=[^"\']+',
                    f'page-help.mjs?v={version}',
                    text
                )
                if updated!=text:
                    loader.write_text(updated,encoding="utf-8")

            page_help=Path("js/help/page-help.mjs")
            if page_help.exists():
                text=page_help.read_text(encoding="utf-8")
                updated=re.sub(
                    r'activity-preferences\.mjs\?v=[^"\']+',
                    f'activity-preferences.mjs?v={version}',
                    text
                )
                if updated!=text:
                    page_help.write_text(updated,encoding="utf-8")

            activity=Path("js/help/activity-preferences.mjs")
            if activity.exists():
                text=activity.read_text(encoding="utf-8")
                updated=re.sub(
                    r'activity-client\.mjs\?v=[^"\']+',
                    f'activity-client.mjs?v={version}',
                    text
                )
                if updated!=text:
                    activity.write_text(updated,encoding="utf-8")

            nav=Path("js/core/adminerva-nav.js")
            if nav.exists():
                text=nav.read_text(encoding="utf-8")
                updated=re.sub(
                    r'navigation-ia\.mjs\?v=[^"\']+',
                    f'navigation-ia.mjs?v={version}',
                    text
                )
                updated=re.sub(
                    r'account-context-switcher\.mjs\?v=[^"\']+',
                    f'account-context-switcher.mjs?v={version}',
                    updated
                )
                if updated!=text:
                    nav.write_text(updated,encoding="utf-8")

            for module_path in [
                "js/student/school-student-settings.mjs",
                "js/student/school-student-projects.mjs",
            ]:
                module=Path(module_path)
                if module.exists():
                    text=module.read_text(encoding="utf-8")
                    updated=re.sub(
                        r'github-session\.mjs\?v=[^"\']+',
                        f'github-session.mjs?v={version}',
                        text
                    )
                    if updated!=text:
                        module.write_text(updated,encoding="utf-8")

            assessments=Path("js/student/assessments.js")
            if assessments.exists():
                text=assessments.read_text(encoding="utf-8")
                updated=re.sub(
                    r'student-access\.mjs\?v=[^"\']+',
                    f'student-access.mjs?v={version}',
                    text
                )
                if updated!=text:
                    assessments.write_text(updated,encoding="utf-8")

            dashboard=Path("js/student/dashboard.js")
            if dashboard.exists():
                text=dashboard.read_text(encoding="utf-8")
                updated=re.sub(
                    r'student-access\.mjs\?v=[^"\']+',
                    f'student-access.mjs?v={version}',
                    text
                )
                if updated!=text:
                    dashboard.write_text(updated,encoding="utf-8")

            changed=0
            for path in Path(".").rglob("*.html"):
                if ".git" in path.parts:
                    continue
                text=path.read_text(encoding="utf-8")
                updated=re.sub(r'css/adminerva-ui\.css\?v=[^"\']+', f'css/adminerva-ui.css?v={version}', text)
                updated=re.sub(r'css/public-shell\.css\?v=[^"\']+', f'css/public-shell.css?v={version}', updated)
                updated=re.sub(r'css/documentation\.css\?v=[^"\']+', f'css/documentation.css?v={version}', updated)
                updated=re.sub(r'js/core/adminerva-loader\.js\?v=[^"\']+', f'js/core/adminerva-loader.js?v={version}', updated)
                updated=re.sub(r'js/core/release-footer\.js\?v=[^"\']+', f'js/core/release-footer.js?v={version}', updated)
                updated=re.sub(r'js/core/owner-school-registry\.mjs\?v=[^"\']+', f'js/core/owner-school-registry.mjs?v={version}', updated)
                updated=re.sub(r'js/core/adminerva-nav\.js\?v=[^"\']+', f'js/core/adminerva-nav.js?v={version}', updated)
                updated=re.sub(r'js/core/public-shell\.mjs\?v=[^"\']+', f'js/core/public-shell.mjs?v={version}', updated)
                updated=re.sub(r'js/core/auth-guard-v4-pilot\.js\?v=[^"\']+', f'js/core/auth-guard-v4-pilot.js?v={version}', updated)
                updated=re.sub(r'js/school-admin/people-access\.mjs\?v=[^"\']+', f'js/school-admin/people-access.mjs?v={version}', updated)
                updated=re.sub(r'js/student/assessments\.js\?v=[^"\']+', f'js/student/assessments.js?v={version}', updated)
                updated=re.sub(r'js/student/dashboard\.js\?v=[^"\']+', f'js/student/dashboard.js?v={version}', updated)
                updated=re.sub(r'js/student/assessment-evidence\.mjs\?v=[^"\']+', f'js/student/assessment-evidence.mjs?v={version}', updated)
                updated=re.sub(r'js/student/submission-receipts\.mjs\?v=[^"\']+', f'js/student/submission-receipts.mjs?v={version}', updated)
                updated=re.sub(r'js/student/school-student-settings\.mjs\?v=[^"\']+', f'js/student/school-student-settings.mjs?v={version}', updated)
                updated=re.sub(r'js/student/school-student-projects\.mjs\?v=[^"\']+', f'js/student/school-student-projects.mjs?v={version}', updated)
                updated=re.sub(r'js/settings/settings-core\.js\?v=[^"\']+', f'js/settings/settings-core.js?v={version}', updated)
                updated=re.sub(r'js/settings/account-preferences\.mjs\?v=[^"\']+', f'js/settings/account-preferences.mjs?v={version}', updated)
                updated=re.sub(r'js/settings/role-settings\.mjs\?v=[^"\']+', f'js/settings/role-settings.mjs?v={version}', updated)
                if 'js/core/adminerva-loader.js' in updated and 'js/core/release-footer.js' not in updated:
                    match=re.search(r'<script[^>]+src=["\']((?:\.\./)*js/core/adminerva-loader\.js\?v=[^"\']+)["\'][^>]*></script>', updated)
                    if match:
                        loader_src=match.group(1)
                        prefix=loader_src.split('js/core/adminerva-loader.js',1)[0]
                        tag=f'<script defer src="{prefix}js/core/release-footer.js?v={version}"></script>'
                        updated=updated[:match.start()]+tag+'\n'+updated[match.start():]
                if updated!=text:
                    path.write_text(updated,encoding="utf-8")
                    changed+=1
            print(f"Updated {changed} HTML files")
            PY
            if git diff --quiet -- '*.html' 'js/core/adminerva-nav.js' 'js/core/adminerva-loader.js' 'js/help/page-help.mjs' 'js/help/activity-preferences.mjs' 'js/student/assessments.js' 'js/student/dashboard.js' 'js/student/school-student-settings.mjs' 'js/student/school-student-projects.mjs'; then
              echo "No shared shell references needed updating."
              exit 0
            fi
            git add -- '*.html' 'js/core/adminerva-nav.js' 'js/core/adminerva-loader.js' 'js/help/page-help.mjs' 'js/help/activity-preferences.mjs' 'js/student/assessments.js' 'js/student/dashboard.js' 'js/student/school-student-settings.mjs' 'js/student/school-student-projects.mjs'
            git commit -m "chore(ui): refresh shared shell and access assets [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            if [ "$(git rev-parse FETCH_HEAD)" = "$base" ]; then
              echo "::error::Cache refresh push failed without a concurrent main update."
              exit 1
            fi
            echo "Main advanced; regenerating references from the new head (attempt $attempt/3)."
          done
          echo "::error::Main kept advancing during cache refresh; no concurrent work was overwritten."
          exit 1
