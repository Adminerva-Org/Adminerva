name: Shared UI cache bump

on:
  push:
    branches: [main]
    paths:
      - "css/adminerva-ui.css"
      - "js/core/adminerva-nav.js"
      - ".github/workflows/shared-ui-cache-bump.yml"

permissions:
  contents: write

jobs:
  refresh-html-asset-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh shared UI asset versions on every HTML page
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_SHA:0:12}"
          python - <<'PY'
          from pathlib import Path
          import os, re

          version=os.environ["VERSION"]
          changed=0
          for path in Path(".").rglob("*.html"):
              if ".git" in path.parts:
                  continue
              text=path.read_text(encoding="utf-8")
              updated=re.sub(r'css/adminerva-ui\.css\?v=[^"\']+', f'css/adminerva-ui.css?v={version}', text)
              updated=re.sub(r'js/core/adminerva-nav\.js\?v=[^"\']+', f'js/core/adminerva-nav.js?v={version}', updated)
              if updated!=text:
                  path.write_text(updated,encoding="utf-8")
                  changed+=1
          print(f"Updated {changed} HTML files")
          PY
        env:
          VERSION: ${{ github.sha }}
      - name: Commit refreshed references
        shell: bash
        run: |
          if git diff --quiet -- '*.html'; then
            echo "No HTML asset references needed updating."
            exit 0
          fi
          git config user.name "Adminerva UI Sync"
          git config user.email "actions@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "chore(ui): refresh shared shell assets [skip ci]"
          git push
