name: Shared UI cache bump

on:
  push:
    branches: [main]
    paths:
      - "css/adminerva-ui.css"
      - "js/core/adminerva-nav.js"
      - "js/core/navigation-ia.mjs"
      - "js/core/auth-guard-v4-pilot.js"
      - ".github/workflows/shared-ui-cache-bump.yml"

permissions:
  contents: write

jobs:
  refresh-shared-shell-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh shared UI and access versions
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_SHA:0:12}"
          python - <<'PY'
          from pathlib import Path
          import os, re

          version=os.environ["VERSION"]

          nav=Path("js/core/adminerva-nav.js")
          if nav.exists():
              text=nav.read_text(encoding="utf-8")
              updated=re.sub(
                  r'navigation-ia\.mjs\?v=[^"\']+',
                  f'navigation-ia.mjs?v={version}',
                  text
              )
              if updated!=text:
                  nav.write_text(updated,encoding="utf-8")

          changed=0
          for path in Path(".").rglob("*.html"):
              if ".git" in path.parts:
                  continue
              text=path.read_text(encoding="utf-8")
              updated=re.sub(r'css/adminerva-ui\.css\?v=[^"\']+', f'css/adminerva-ui.css?v={version}', text)
              updated=re.sub(r'js/core/adminerva-nav\.js\?v=[^"\']+', f'js/core/adminerva-nav.js?v={version}', updated)
              updated=re.sub(r'js/core/auth-guard-v4-pilot\.js\?v=[^"\']+', f'js/core/auth-guard-v4-pilot.js?v={version}', updated)
              if updated!=text:
                  path.write_text(updated,encoding="utf-8")
                  changed+=1
          print(f"Updated {changed} HTML files")
          PY
        env:
          VERSION: ${{ github.sha }}
      - name: Commit refreshed references
        shell: bash
        run: |
          if git diff --quiet -- '*.html' 'js/core/adminerva-nav.js'; then
            echo "No shared shell references needed updating."
            exit 0
          fi
          git config user.name "Adminerva UI Sync"
          git config user.email "actions@users.noreply.github.com"
          git add -- '*.html' 'js/core/adminerva-nav.js'
          git commit -m "chore(ui): refresh shared shell and access assets [skip ci]"
          git push
