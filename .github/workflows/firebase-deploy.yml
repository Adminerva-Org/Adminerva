name: Firebase backend deployment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "firebase.json"
      - ".github/workflows/firebase-deploy.yml"

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix functions
      - name: Prepare Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_REPOREVIEW_E7CA4 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            echo "::error::Configure repository secret FIREBASE_SERVICE_ACCOUNT_REPOREVIEW_E7CA4 before deploying."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      # Firebase CLI requires --force the first time a retry-enabled event trigger
      # is created. Scope that approval to this single idempotent outbox worker;
      # do NOT add --force to the sitewide Functions/Firestore deployment.
      - name: Initialize retryable exam session event trigger if missing
        shell: bash
        run: |
          set -euo pipefail
          installed="$(npx -y firebase-tools@14 functions:list --project reporeview-e7ca4)"
          if [[ "$installed" != *"schoolStudioExamSessionFanout"* ]]; then
            npx -y firebase-tools@14 deploy --project reporeview-e7ca4 --only functions:schoolStudioExamSessionFanout --non-interactive --force
          else
            echo "Retryable exam fanout already installed; normal deployment can proceed."
          fi
      - name: Deploy Functions and Firestore indexes
        run: npx -y firebase-tools@14 deploy --project reporeview-e7ca4 --only firestore:rules,firestore:indexes,functions --non-interactive
