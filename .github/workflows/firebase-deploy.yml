name: MCS SHS scoped pilot operator

on:
  push:
    branches: [main]
    paths:
      - "ops/mcs-shs-pilot-trigger.json"

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install protected operator dependencies
        run: npm ci --prefix functions
      - name: Prepare Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_REPOREVIEW_E7CA4 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            echo "::error::Firebase operator credential is not configured."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - name: Execute protected four-section MCS SHS migration
        env:
          NODE_PATH: ${{ github.workspace }}/functions/node_modules
        run: node scripts/mcs-shs-pilot-live-execute.cjs
      - name: Remove protected credential file
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
