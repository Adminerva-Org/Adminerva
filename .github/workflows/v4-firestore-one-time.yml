name: V4 one-time Firestore permission smoke
on:
  push:
    branches:
      - verify/v4-firestore-20261110
permissions:
  contents: read
jobs:
  tenant-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install local emulator and test SDK
        run: npm install --no-audit --no-fund --no-save @firebase/rules-unit-testing@4 firebase@11 firebase-tools@14 firebase-admin@13
      - name: Exercise legacy-grade isolation and Firestore authority boundaries
        run: npx firebase emulators:exec --project demo-adminerva-security --only firestore 'node --test --test-concurrency=1 tests/firestore-rules.test.mjs'
