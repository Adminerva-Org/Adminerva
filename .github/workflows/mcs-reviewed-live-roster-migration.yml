name: MCS controlled pilot preflight (no production writes)
#
# The earlier workflow applied a live migration automatically when this YAML was
# pushed to main. That is not an approval boundary. Do not give a GitHub Actions
# test job Firebase Admin credentials or auto-approve real student mappings.
# The protected subset migration is a separate reviewed operator procedure:
# docs/adminerva-4-mcs-shs-controlled-pilot-runbook.md
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate non-secret four-section pilot configuration
        run: |
          node --test tests/mcs-pilot-mapping.test.mjs
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            import assert from "node:assert/strict";
            const cfg=JSON.parse(readFileSync("docs/adminerva-4-mcs-pilot-academic-defaults.json","utf8"));
            const expected=cfg.operationalPilot?.currentApprovedSectionCounts||cfg.rosterReference?.pilotSectionCounts;
            assert.equal(cfg.schoolId,"mcs-manila");
            assert.equal(cfg.compatibilityModeDuringPilot,"legacy_allowed");
            assert.equal(Object.values(expected||{}).reduce((a,b)=>a+Number(b),0),169);
            const trigger=JSON.parse(readFileSync("ops/mcs-shs-pilot-trigger.json","utf8"));
            assert.equal(trigger.productionAuthorized,false);
            assert.equal(trigger.startPilot,false);
            assert.equal(trigger.v4Only,false);
            assert.equal(trigger.historicalMigration,false);
            console.log("Pilot configuration preflight passed; no Firebase connection or data writes.");
          '
