name: MCS reviewed live roster canonical migration
# display-name-pass-5

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mcs-reviewed-live-roster-migration.yml"

permissions:
  contents: read

concurrency:
  group: mcs-reviewed-live-roster-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions
      - name: Prepare Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_REPOREVIEW_E7CA4 }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - name: Apply reviewed 169-student canonical V4 pilot migration
        shell: bash
        run: |
          cd functions
          NODE_PATH="$PWD/node_modules" node ../scripts/mcs-shs-pilot-live-execute.cjs
      - if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
