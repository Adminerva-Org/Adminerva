name: MCS SHS live pilot readiness (aggregate read-only)
# Run once on this reviewed integration branch; afterward, operator dispatch only.
on:
  push:
    branches:
      - ops/v4-pilot-readiness-report-20261110
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install backend read SDK
        run: npm ci --prefix functions --no-audit --no-fund
      - name: Prepare protected read identity
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_REPOREVIEW_E7CA4 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FIREBASE_SERVICE_ACCOUNT:-}"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - name: Report four-section MCS pilot blockers (no writes)
        run: NODE_PATH="$PWD/functions/node_modules" node scripts/mcs-pilot-readiness-summary.cjs
      - name: Remove protected credential
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
