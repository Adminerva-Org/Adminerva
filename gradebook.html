<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gradebook Matrix | Adminerva</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/adminerva-ui.css?v=1" />
</head>
  <body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col">
    <!-- Sidebar Navigation -->
    <div id="adminerva-nav" data-module="repo" data-page="gradebook"></div>

    <main class="flex-1 px-8 pl-20 py-10 h-screen overflow-y-auto">
      <header class="mb-8">
        <h1
          class="text-3xl font-extrabold text-slate-900 tracking-tight flex items-center gap-3"
        >
          <span class="text-indigo-600">📊</span> Gradebook Matrix
        </h1>
        <p class="text-slate-500 mt-2 font-medium">
          Audit student scores, missing submissions, and control grade
          visibility.
        </p>
      </header>

      <!-- Matrix Controls -->
      <div
        class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-col md:flex-row gap-4"
      >
        <div class="flex-1">
          <label
            class="block text-[10px] font-extrabold text-slate-400 uppercase tracking-widest mb-2"
            >Class Section</label
          >
          <select
            id="gbSection"
            class="w-full border border-slate-300 rounded-lg px-4 py-2.5 bg-slate-50 font-bold text-slate-700 outline-none focus:ring-2 focus:ring-indigo-500 transition"
          ></select>
        </div>
        <div class="flex-1">
          <label
            class="block text-[10px] font-extrabold text-slate-400 uppercase tracking-widest mb-2"
            >Target Assessment</label
          >
          <select
            id="gbAssessment"
            class="w-full border border-slate-300 rounded-lg px-4 py-2.5 bg-slate-50 font-bold text-slate-700 outline-none focus:ring-2 focus:ring-indigo-500 transition"
          ></select>
        </div>
        <div class="flex-1">
          <label
            class="block text-[10px] font-extrabold text-slate-400 uppercase tracking-widest mb-2"
            >Sort By</label
          >
          <select
            id="gbSort"
            class="w-full border border-slate-300 rounded-lg px-4 py-2.5 bg-slate-50 font-bold text-slate-700 outline-none focus:ring-2 focus:ring-indigo-500 transition"
          >
            <option value="lastName">Last Name (A-Z)</option>
            <option value="needsGrading">Needs Grading First</option>
          </select>
        </div>
        <div class="flex items-end">
          <button
            onclick="window.bulkPublishCurrentGrid()"
            class="bg-indigo-600 hover:bg-indigo-700 text-white text-[11px] uppercase tracking-wider font-extrabold py-2.5 px-6 rounded-lg transition shadow-sm w-full md:w-auto h-[42px] flex items-center justify-center gap-2"
          >
            📢 Publish All
          </button>
        </div>
      </div>

      <!-- The Matrix Table -->
      <div
        class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden"
      >
        <table class="min-w-full text-left text-sm whitespace-nowrap">
          <thead
            class="bg-slate-800 text-white text-[10px] uppercase font-extrabold tracking-widest"
          >
            <tr>
              <th class="px-6 py-4 rounded-tl-xl">Student Roster</th>
              <th class="px-6 py-4">Repository Status</th>
              <th class="px-6 py-4">AI Evaluation</th>
              <th class="px-6 py-4 rounded-tr-xl">Student Visibility</th>
            </tr>
          </thead>
          <tbody id="gbTableBody" class="divide-y divide-slate-100">
            <tr>
              <td
                colspan="4"
                class="px-6 py-12 text-center text-slate-400 font-medium italic"
              >
                Select a Section and Assessment above to load the matrix.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>

    <!-- Core Scripts -->
    <script src="js/core/adminerva-nav.js"></script>
    <script src="js/core/adminerva-loader.js"></script>
    <script type="module" src="js/core/auth-guard.js"></script>
    <script type="module" src="js/repo-review/gradebook.js"></script>
  </body>
</html>
