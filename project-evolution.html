<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Evolution | Adminerva RepoReview</title>
<script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/adminerva-ui.css?v=2"></head>
<body class="bg-slate-50 min-h-screen" data-evolution-view="teacher">
<div id="adminerva-nav" data-module="repo" data-page="evolution"></div>
<main id="pageBody" class="hidden max-w-6xl mx-auto p-4 sm:p-8">
<header class="mb-6"><h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900">Project Evolution</h1>
<p class="text-sm text-slate-600 mt-2">Assessment milestones from saved evidence records. A checkpoint marks the reviewed project version, not proof that a particular student authored all files.</p></header>
<section class="bg-white border rounded-xl p-5 mb-5">
<label for="evolutionStudent" class="text-sm font-bold text-slate-700">Student or group member</label>
<select id="evolutionStudent" class="block mt-2 w-full p-3 border rounded-lg"><option value="">Loading students…</option></select>
<p id="evolutionRepository" class="text-xs text-slate-600 mt-3 break-words"></p>
</section>
<p id="evolutionStatus" role="status" class="text-sm text-slate-600 mb-4">Loading project milestones…</p>
<div id="evolutionGrid" class="space-y-4"></div>
</main>
<script src="js/core/adminerva-nav.js?v=2026.10.16.7"></script>
<script src="js/core/adminerva-loader.js?v=2026.10.16.3"></script>
<script type="module" src="js/core/auth-guard.js?v=2026.10.16.3"></script>
<script type="module" src="js/repo-review/project-evolution.mjs?v=2026.10.16.7"></script>
</body></html>
