<!doctype html>
<!-- Lesson reference folders and document management. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Adminerva - Reference Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .group-hover-show {
        visibility: hidden;
      }
      .group:hover .group-hover-show {
        visibility: visible;
      }
    </style>
    <link rel="stylesheet" href="css/adminerva-ui.css?v=2026.10.19.2" />
</head>
  <body class="bg-gray-50 font-sans min-h-screen flex flex-col">
    <div id="adminerva-nav" data-module="lesson" data-page="library"></div>
    <script src="js/core/adminerva-nav.js?v=2026.10.19.2"></script>

    <!-- Main Workspace -->
    <div
      class="max-w-screen-2xl mx-auto w-full p-4 sm:p-6 mt-2 sm:mt-4 flex-1 flex flex-col lg:flex-row gap-4 sm:gap-6"
    >
      <!-- LEFT COLUMN: Folder Directory -->
      <div
        class="w-full lg:w-1/4 bg-white p-5 sm:p-6 rounded-lg shadow-sm border border-gray-200 flex flex-col shrink-0 lg:max-h-[80vh]"
      >
        <h2
          class="text-lg sm:text-xl font-bold text-gray-800 border-b pb-2 mb-4"
        >
          My Drive
        </h2>

        <div
          class="flex flex-col sm:flex-row lg:flex-col xl:flex-row gap-2 mb-5"
        >
          <input
            type="text"
            id="newFolderInput"
            placeholder="New folder name..."
            class="w-full p-3 sm:p-2 border rounded text-base sm:text-sm focus:ring-blue-500 bg-gray-50"
          />
          <button
            onclick="createFolder()"
            class="w-full sm:w-auto lg:w-full xl:w-auto bg-blue-600 text-white px-4 py-3 sm:py-2 rounded font-bold hover:bg-blue-700 transition text-sm flex justify-center items-center gap-1 shrink-0"
          >
            <span>➕</span> New
          </button>
        </div>

        <div
          id="folderList"
          class="flex-1 overflow-y-auto space-y-1 max-h-48 lg:max-h-full pr-1"
        >
          <!-- Dynamically injected folders -->
        </div>
      </div>

      <!-- RIGHT COLUMN: Drive Workspace -->
      <div
        class="w-full lg:w-3/4 bg-white rounded-lg shadow-sm border border-gray-200 flex flex-col overflow-hidden"
      >
        <!-- Top Toolbar -->
        <div
          class="p-4 sm:p-5 border-b flex flex-col sm:flex-row justify-between items-start sm:items-center bg-gray-50 gap-4"
        >
          <h2
            id="activeFolderTitle"
            class="text-lg sm:text-xl font-bold text-gray-800 flex items-center gap-2"
          >
            <span>📂</span> Select a Folder
          </h2>

          <div
            class="flex flex-col sm:flex-row gap-3 items-center w-full sm:w-auto justify-end hidden"
            id="driveToolbar"
          >
            <input
              type="text"
              id="searchInput"
              oninput="filterDocuments()"
              placeholder="Search in folder..."
              class="w-full sm:max-w-xs p-3 sm:p-2 border rounded-full text-base sm:text-sm bg-white focus:ring-2 focus:ring-blue-500 pl-4 shadow-inner"
            />
            <button
              onclick="document.getElementById('pdfFileInput').click()"
              class="w-full sm:w-auto bg-blue-100 text-blue-700 font-bold py-3 sm:py-2 px-4 rounded-full sm:rounded hover:bg-blue-200 transition whitespace-nowrap flex justify-center items-center gap-2 text-sm"
            >
              📄 Upload PDF
            </button>
            <input
              type="file"
              id="pdfFileInput"
              accept="application/pdf"
              multiple
              class="hidden"
              onchange="extractPDF()"
            />
          </div>
        </div>

        <!-- Document List Area (Swipeable on Mobile) -->
        <div
          id="documentWorkspace"
          class="p-0 hidden flex-col flex-1 w-full overflow-x-auto touch-pan-x"
        >
          <div class="min-w-[600px] w-full flex flex-col h-full">
            <!-- Table Header -->
            <div
              class="grid grid-cols-12 gap-4 px-6 py-3 border-b bg-gray-50 text-[10px] sm:text-xs font-bold text-gray-500 uppercase tracking-wider"
            >
              <div class="col-span-6">Name</div>
              <div class="col-span-4">Last Modified</div>
              <div class="col-span-2 text-right">Actions</div>
            </div>

            <!-- Document Rows -->
            <div id="documentList" class="flex-1 overflow-y-auto">
              <!-- Extracted text snippets injected here -->
            </div>
          </div>
        </div>

        <!-- Blank State -->
        <div
          id="blankWorkspace"
          class="p-6 flex-1 flex flex-col items-center justify-center text-gray-400 italic text-center min-h-[300px]"
        >
          <span class="text-5xl sm:text-6xl mb-4">🗂️</span>
          <p class="text-sm sm:text-base">
            Select a folder on the left to view or upload documents.
          </p>
        </div>
      </div>
    </div>

    <!-- Removed hardcoded GLOBAL LOADING OVERLAY. Adminerva-loader.js will handle the pop-up -->

    <script type="module" src="js/lesson-review/library.js?v=2026.10.19.2"></script>
    <script type="module" src="js/core/auth-guard.js?v=2026.10.19.2"></script>
    <script src="js/core/adminerva-loader.js?v=2026.10.19.2"></script>
  </body>
</html>
